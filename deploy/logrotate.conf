# Ротация журналов funding_bot (внешнее ревью 11.09: collector.log рос без ограничений).
# copytruncate — systemd пишет в файл через StandardOutput=append, дескриптор не переоткрывается.
/home/admin/hyper/funding_bot/logs/*.log {
    su admin admin
    daily
    maxsize 50M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
