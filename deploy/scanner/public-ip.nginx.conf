server {
    listen 80 default_server;
    server_name 34.65.234.12;
    client_max_body_size 1k;
    # This listener exposes only public markets, never cabinet or trading routes.
    location = / { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8792; }
    location = /data.json { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8792; }
    location = /status { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8792; }
    location / { return 404; }
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
}
