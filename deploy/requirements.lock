# funding_bot — полное замыкание зависимостей выката: runtime, extra trade и sol, тесты (dev).
# Ставится только так: pip install --no-deps -r deploy/requirements.lock, затем pip check (транзитивных «сверх lock» нет).
# Цели: Python 3.11 Linux x86_64 (сервер) и Python 3.12 macOS (разработка) — одни и те же версии; маркеров
# окружения, которые меняли бы набор между ними, в замыкании нет (сверяет tests/test_sol_c4_release.py в том
# окружении, где идут тесты: на Маке — .venv, на сервере — чистый venv .next).
# Колёса — только бинарные (--only-binary=:all:): нет колеса под сервер — выкат встаёт на шаге тестов, до переключения.
# Хеши: при выкате. Без скачивания их не получить; deploy/remote_test.sh пишет SHA256SUMS скачанных колёс,
# deploy/remote_switch.sh ставит в боевой venv ровно эти файлы (sha256sum -c) и без сети.
# Версию меняют только вместе с pyproject.toml и полным прогоном тестов.

