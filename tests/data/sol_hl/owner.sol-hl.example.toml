[emergency.sol_best_hyperliquid]
auto_unwind_spot_after_proven_zero_hedge = false
auto_rebuy_spot_after_proven_zero_close = false
auto_sell_surplus_after_resolved_hedge = false
auto_correct_known_delta = false
# Разрешения и loss/slippage/time caps заполняются владельцем до включения автоматических действий.
# max_loss_usdc = "..."
# max_hedge_slippage_bps = ...
# max_unwind_slippage_bps = ...
